[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Intentional relaxations for this codebase:
# - BLE001/S110: broad excepts only around log-and-report boundaries (db.close, per-product
#   failure capture in the CLI); they re-raise or log, never swallow silently.
# - DTZ005: timestamps are written as server-local naive datetimes on purpose — the
#   production DB stores naive datetimes (VirtueMart convention).
ignore = ["BLE001", "S110", "DTZ005"]
